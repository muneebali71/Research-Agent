# Docker is used ONLY for Qdrant in this project.
# PostgreSQL runs locally (not in Docker).
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research_agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
